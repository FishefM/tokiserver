<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKISERVER - ADMIN PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- Barra de navegación dinámica -->
    <nav class="navbar" id="dynamic-navbar">
        <a href="/">HOME</a>
    </nav>

    <!-- Contenedor de partículas ASCII -->
    <div class="particles-container" id="particles"></div>

    <!-- Contenido Principal -->
    <main class="main-container">
        <!-- Encabezado con estado del backend e IP del cliente -->
        <header class="header-panel">
            <div>
                <h1 class="header-title">ADMIN // CONTROL_PANEL</h1>
                <p style="font-size: 1.2rem; opacity: 0.8;">TOKISERVER ROOT ACCESS PROTOCOL v1.0</p>
            </div>
            <div class="badge-status" id="backend-status-badge">
                <span class="status-dot"></span>
                <span id="backend-status-text">CONNECTING BACKEND...</span>
            </div>
        </header>

        <!-- Botones de Control de Sistema y Docker -->
        <section class="card">
            <h2 class="card-header">> SYSTEM_COMMANDS & DOCKER CONTROLS</h2>
            <div class="controls-grid">
                <!-- Botón dinámico de Minecraft Server (mc_forge_server) -->
                <button class="btn-cmd" id="btn-minecraft" onclick="executeCommand('MINECRAFT_TOGGLE')">
                    <span id="mc-btn-label">> MINECRAFT SERVER</span>
                    <span id="mc-btn-status" style="font-size: 1.1rem;">[CHECKING...]</span>
                </button>

                <!-- Botón dinámico de Core Keeper Server (corekeeper-server.service) -->
                <button class="btn-cmd" id="btn-corekeeper" onclick="executeCommand('COREKEEPER_TOGGLE')">
                    <span id="ck-btn-label">> CORE KEEPER SERVER</span>
                    <span id="ck-btn-status" style="font-size: 1.1rem;">[CHECKING...]</span>
                </button>

                <button class="btn-cmd" onclick="executeCommand('PURGE_CACHE')">
                    <span>> PURGE_CACHE</span>
                    <span>🧹</span>
                </button>
                <button class="btn-cmd" onclick="executeCommand('SYS_DIAGNOSTICS')">
                    <span>> SYS_DIAGNOSTICS</span>
                    <span>🔍</span>
                </button>
                <button class="btn-cmd" onclick="executeCommand('VIEW_LOGS')">
                    <span>> VIEW_LOGS</span>
                    <span>📜</span>
                </button>
                <button class="btn-cmd danger" onclick="executeCommand('LOCK_SESSION')">
                    <span>> LOCK_SESSION</span>
                    <span>🔒</span>
                </button>
            </div>
        </section>

        <!-- Consola de Salida CRT -->
        <section class="card">
            <h2 class="card-header">> CONSOLE_OUTPUT</h2>
            <div class="terminal-box" id="console-output">
                <div class="terminal-line">> INITIALIZING ADMIN CONSOLE... OK</div>
            </div>
        </section>
    </main>

    <!-- Script Modular del Panel -->
    <script src="js/admin.js"></script>
</body>
</html>
