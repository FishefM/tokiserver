<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKISERVER - LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/login/css/login.css">
    <!-- Precarga de imágenes de avatares -->
    <link rel="preload" as="image" href="/img/avatars/yucef.png">
    <link rel="preload" as="image" href="/img/avatars/jesus.png">
    <link rel="preload" as="image" href="/img/avatars/hector.png">
    <link rel="preload" as="image" href="/img/avatars/inge.png">
    <link rel="preload" as="image" href="/img/avatars/kitzya.png">
</head>
<body>

    <!-- Barra de navegación dinámica -->
    <nav class="navbar" id="dynamic-navbar">
        <a href="/">HOME</a>
    </nav>

    <!-- Contenedor de partículas ASCII -->
    <div class="particles-container" id="particles"></div>

    <!-- PANTALLA DE LOGIN DE USUARIO -->
    <main class="login-page-container">
        <div class="login-card desktop-split">
            <!-- Columna Izquierda (Vista Previa de Avatar) -->
            <div class="login-left-col">
                <div class="user-avatar-card-desktop" id="avatar-preview-box">
                    <div class="avatar-carousel-wrapper">
                        <button type="button" class="btn-avatar-nav prev" onclick="navigateUser(-1)" title="Usuario anterior">◀</button>
                        <div class="avatar-frame-large">
                            <img id="user-avatar-img" src="/img/avatars/yucef.png" alt="Avatar" class="user-avatar-img-large">
                        </div>
                        <button type="button" class="btn-avatar-nav next" onclick="navigateUser(1)" title="Siguiente usuario">▶</button>
                    </div>
                    <div class="user-avatar-details">
                        <span id="user-avatar-role" class="user-avatar-role">YUCEF</span>
                        <span id="user-avatar-phrase" class="user-avatar-status">VIVA CRISTO REY</span>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Formulario de Login -->
            <div class="login-right-col">
                <div class="login-header">
                    <h1 class="login-title">> LOGIN</h1>
                    <p class="login-subtitle">¿Quién anda molestando hoy?</p>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-username">> USADO DIGO USUARIO:</label>
                        <select id="login-username" class="crt-input" onchange="updateLoginAvatar(true)" required>
                            <option value="Yucef" selected>Yucef</option>
                            <option value="Jesus">Jesus</option>
                            <option value="Hector">Hector</option>
                            <option value="Inge">Inge</option>
                            <option value="Kitzya">Kitzya</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="login-password">> SECRETO:</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="login-password" class="crt-input" placeholder="Si bro, aqui va la contraseña" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility('login-password', this)" title="Mostrar/Ocultar contraseña">
                                <span class="pixel-icon-mask magenta" style="-webkit-mask-image: url('/img/icons/eye.svg'); mask-image: url('/img/icons/eye.svg');"></span>
                            </button>
                        </div>
                    </div>

                    <div class="auth-msg" id="login-error-msg"></div>

                    <button type="submit" id="login-submit-btn" class="btn-cmd btn-login">
                        <span>> INICIAR SESIÓN</span>
                        <span class="pixel-icon-mask magenta" style="-webkit-mask-image: url('/img/icons/lock.svg'); mask-image: url('/img/icons/lock.svg'); width: 22px; height: 22px;"></span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="/js/navbar.js"></script>
    <script src="/js/particles.js"></script>
    <script type="module" src="/login/js/login.js"></script>
</body>
</html>
